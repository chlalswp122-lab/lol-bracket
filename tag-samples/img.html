<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>img 태그 샘플</title>
</head>
<body>
<h1>&lt;img&gt; 태그 샘플</h1>
<p>이미지를 문서에 표시할 때 사용하는 태그입니다.</p>

<h2>기본 사용</h2>
<img src="https://picsum.photos/id/1025/400/300" alt="강아지 예시 이미지" width="400" height="300">

<h2>alt 속성 (대체 텍스트)</h2>
<img src="https://broken-url-example.com/none.jpg" alt="이미지를 불러올 수 없을 때 표시되는 대체 텍스트">

<h2>반응형 크기 지정</h2>
<img src="https://picsum.photos/id/1035/800/400" alt="풍경 이미지" style="max-width:100%; height:auto;">
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>embed 태그 샘플</title>
</head>
<body>
<h1>&lt;embed&gt; 태그 샘플</h1>
<p>외부 리소스(이미지, PDF 등)를 문서에 직접 삽입할 때 사용하는 태그입니다.</p>

<h2>이미지 삽입</h2>
<embed src="https://picsum.photos/id/237/400/300" type="image/jpeg" width="400" height="300">

<h2>PDF 삽입</h2>
<embed src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" type="application/pdf" width="400" height="300">
</body>
</html>
